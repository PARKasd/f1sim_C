bridge:
  ros__parameters:
    # topics and namespaces
    ego_namespace: 'ego_racecar'
    ego_scan_topic: 'scan'
    ego_odom_topic: 'odom'
    ego_opp_odom_topic: 'opp_odom'
    ego_drive_topic: 'drive'
    opp_namespace: 'opp_racecar'
    opp_scan_topic: 'opp_scan'
    opp_odom_topic: 'odom'
    opp_ego_odom_topic: 'opp_odom'
    opp_drive_topic: 'opp_drive'

    # transform related
    scan_distance_to_base_link: 0.275
    
    # laserscan parameters
    scan_fov: 4.7
    scan_beams: 1080

    # simulation parameters
    timestep: 0.01
    integrator: 'RK4'

    # vehicle dynamics parameters
    vehicle:
      mu: 1.0489
      C_Sf: 4.718
      C_Sr: 5.4562
      lf: 0.15875
      lr: 0.17145
      h: 0.074
      m: 3.74
      I: 0.04712
      s_min: -0.4189
      s_max: 0.4189
      sv_min: -3.2
      sv_max: 3.2
      v_switch: 7.319
      a_max: 9.51
      v_min: -5.0
      v_max: 20.0
      width: 0.31
      length: 0.58

    # map parameters
    # A bare name (e.g. 'levine', 'Spielberg_map') is resolved against the maps
    # bundled with this package (f1tenth_gym_ros/maps). Use an absolute path
    # without the extension to load a custom map.
    map_path: 'levine'
    map_img_ext: '.png'

    # opponent parameters
    num_agent: 1

    # ego starting pose on map
    sx: 0.0
    sy: 0.0
    stheta: 0.0

    # opp starting pose on map
    sx1: 2.0
    sy1: 0.5
    stheta1: 0.0

    # teleop
    kb_teleop: True
